<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 생성기 — 2단계 체험</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @page { size: A3 landscape; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #f5f6f8;
    padding: 0;
  }

  /* ======= 전체 레이아웃: 사이드바 + 메인 ======= */
  .app-layout {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 230px;
    flex-shrink: 0;
    background: #08213f;
    color: white;
    box-shadow: 2px 0 4px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    height: 100vh;
    align-self: flex-start;
    overflow: hidden;
    transition: width 0.22s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
  }
  .sidebar.collapsed {
    width: 48px;
  }

  /* ── 토글 버튼 행: 항상 표시, 사이드바 상단 고정 ── */
  .sb-toggle-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 10px 10px 0 16px;
    flex-shrink: 0;
    min-width: 230px; /* 펼쳐진 너비 기준 */
  }
  /* 접혔을 때: 버튼을 중앙 정렬 */
  .sidebar.collapsed .sb-toggle-row {
    justify-content: center;
    padding: 14px 0;
    min-width: 0;
  }
  .sb-toggle-row .sb-logo {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
  }
  .sb-toggle-row .sb-logo .sb-team {
    font-size: 10px; color: #c8cdd4; letter-spacing: 1px; margin-bottom: 2px;
  }
  .sb-toggle-row .sb-logo .sb-team-name {
    font-size: 15px; font-weight: 700; color: white;
  }
  /* 접혔을 때 로고 숨김 */
  .sidebar.collapsed .sb-toggle-row .sb-logo { display: none; }

  /* 토글 버튼 자체 */
  .sb-toggle {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c8cdd4;
    font-size: 14px;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
    user-select: none;
  }
  .sb-toggle:hover { background: rgba(255,255,255,0.12); color: white; }

  /* ── 콘텐츠 영역: 펼쳐진 상태에서만 표시 ── */
  .sidebar-inner {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 0 14px;
    min-width: 230px; /* 접혀도 내부 너비 유지 → overflow:hidden에 의해 클립 */
    box-sizing: border-box;
    border-top: 1px solid #1a4a7a;
    margin-top: 8px;
  }
  /* 접혔을 때 콘텐츠 완전 숨김 */
  .sidebar.collapsed .sidebar-inner {
    display: none;
  }

  /* ======= 사이드바 축소 ======= */

  .sidebar .region-group {
    margin-bottom: 6px;
  }
  .sidebar .region-title {
    padding: 6px 16px;
    font-size: 12px; font-weight: 700;
    color: #fdbb31;
    letter-spacing: -0.3px;
    border-left: 3px solid #fdbb31;
    background: rgba(253, 187, 49, 0.08);
    margin-bottom: 2px;
  }
  .sidebar .site-item {
    padding: 6px 16px 6px 28px;
    font-size: 11.5px;
    color: #c8cdd4;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    user-select: none;
    position: relative;
  }
  .sidebar .site-item:hover:not(.disabled) {
    background: #1a4a7a; color: white;
  }
  .sidebar .site-item.active {
    background: #265e99; color: white; font-weight: 700;
    border-left-color: #fdbb31;
  }
  .sidebar .site-item.disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .sidebar .site-item.disabled::after {
    content: ' (대기)';
    font-size: 8.5px;
    color: #6b7280;
  }
  .main-content {
    flex: 1;
    padding: 12px;
    overflow-x: auto;
  }

  /* ======= 헤더 ======= */
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid #08213f;
  }
  .report-header .breadcrumb {
    font-size: 13px;
    color: #4a5568;
    margin-bottom: 2px;
  }
  .report-header .title {
    font-size: 21px;
    font-weight: 700;
    color: #08213f;
  }
  .report-header .subtitle {
    font-size: 13px;
    color: #4a5568;
    margin-top: 2px;
  }
  .report-header .meta { font-size: 13px; color: #4a5568; text-align: right; }
  .report-header .meta strong { color: #08213f; font-size: 12px; }
  .report-header .note { color: #961e1e; font-size: 10px; margin-top: 2px; }

  /* ======= 현장 탭 ======= */
  .site-tabs {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-bottom: 8px; padding: 6px;
    background: white; border: 1px solid #c8cdd4;
  }
  .site-tab {
    padding: 5px 12px; border: 1px solid #c8cdd4; background: #f7f8fa;
    color: #4a5568; font-size: 10px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; user-select: none; border-radius: 2px;
  }
  .site-tab:hover:not(.disabled) { background: #ebf2fa; border-color: #265e99; color: #08213f; }
  .site-tab.active { background: #08213f; color: white; border-color: #08213f; }
  .site-tab.disabled { opacity: 0.4; cursor: not-allowed; background: #ebecef; }
  .site-panel { display: none; }
  .site-panel.active { display: block; }

  /* ======= 섹션 ======= */
  .section { background: white; border: 1px solid #c8cdd4; margin-bottom: 6px; }
  .section-title {
    background: #08213f; color: white; padding: 5px 10px;
    font-size: 14px; font-weight: 700; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .badge {
    background: #fdbb31; color: #08213f; padding: 1px 6px;
    border-radius: 2px; font-size: 10.5px; font-weight: 700;
  }
  .section-title .desc { margin-left: auto; font-size: 9px; font-weight: 400; color: #c8cdd4; }

  /* ======= 데이터 표 ======= */
  table.data-table {
    width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed;
  }
  table.data-table th, table.data-table td {
    border: 1px solid #c8cdd4; padding: 3px 4px;
    text-align: center; vertical-align: middle; height: 24px;
  }
  table.data-table thead th {
    background: #08213f; color: white; font-weight: 600; font-size: 12px;
  }
  table.data-table thead th.group-처리 { background: #265e99; }
  table.data-table thead th.group-미처리 { background: #961e1e; }
  table.data-table thead th.group-일반 { background: #a04040; }
  table.data-table thead th.group-장기 { background: #7a1818; }
  table.data-table thead th.sub { background: #1a4a7a; font-size: 10.5px; font-weight: 600; }
  table.data-table thead th.sub-미처리 { background: #b03030; font-size: 10.5px; font-weight: 600; }
  table.data-table thead th.sub-장기 { background: #962525; font-size: 10.5px; font-weight: 600; }
  /* 합계 컬럼 - 첨부 사진과 동일하게 미처리 그룹 색상으로 통일 */
  table.data-table thead th.sum-head { background: #961e1e; font-weight: 700; }
  table.data-table thead th.sum-change { background: #961e1e; font-weight: 700; }

  table.data-table tbody td.label-cell {
    background: #f7f8fa; font-weight: 700; color: #08213f; font-size: 11.5px;
  }
  table.data-table tbody td.month-label {
    background: #08213f; color: white; font-weight: 700; font-size: 11px;
    width: 32px;
  }
  table.data-table tbody td.num { font-variant-numeric: tabular-nums; }
  table.data-table tbody td.proc-current { background: #e8f1fb; }
  /* 합계 컬럼 - 당월/주간 처리처럼 옅은 음영 */
  table.data-table tbody td.sum-cell { background: #fdeded; }
  table.data-table tbody td.rate { font-weight: 600; color: #08213f; }
  .change-up { color: #961e1e; font-weight: 600; }
  .change-down { color: #006e2e; font-weight: 600; }
  .change-zero { color: #6b7280; }

  /* 월별 구분선 - 네이비 색만으로 구분 */
  table.data-table tbody tr.month-end td {
    border-bottom: 1px solid #08213f;
  }

  /* ======= 공종 상위 5 + 기타 + 합계 ======= */
  table.trade-table {
    width: 100%; border-collapse: collapse; font-size: 11.5px; table-layout: auto;
  }
  table.trade-table th, table.trade-table td {
    border: 1px solid #c8cdd4; padding: 7px 10px; text-align: center; height: 32px;
    white-space: nowrap;
  }
  table.trade-table thead th { background: #1a4a7a; color: white; font-weight: 600; }
  table.trade-table thead th.group-month { background: #265e99; }
  table.trade-table tbody td.rank {
    background: #08213f; color: white; font-weight: 700; width: 38px;
  }
  table.trade-table tbody td.rank-etc { background: #08213f; }
  table.trade-table tbody td.trade-name {
    background: #f7f8fa; font-weight: 700; text-align: center; color: #08213f;
  }
  table.trade-table tbody td.vendor { text-align: center; font-size: 11.5px; color: #4a5568; }
  table.trade-table tbody td.plan {
    background: #fffbe6; text-align: left; color: #6b7280;
     font-size: 11.5px;
    min-width: 200px;
  }
  table.trade-table tbody tr.etc-row td { background: #f0f1f5; }
  table.trade-table tbody tr.etc-row td.rank-etc { background: #08213f; }
  table.trade-table tbody tr.etc-row td.trade-name { background: #e8eaef; }
  table.trade-table tbody tr.etc-row td.plan { background: #f5f5e8; }
  table.trade-table tbody tr.sum-row td {
    background: #08213f; color: white; font-weight: 700;
  }
  table.trade-table tbody tr.sum-row td.trade-name { background: #08213f; color: white; }
  table.trade-table tbody tr.sum-row td.vendor { background: #08213f; color: #c8cdd4; }
  table.trade-table tbody tr.sum-row td.plan { background: #08213f; color: #c8cdd4; }
  table.trade-table tbody tr.sum-row .change-up { color: #fdbb31; }
  table.trade-table tbody tr.sum-row .change-down { color: #4ade80; }
  table.trade-table tbody td.month-cur {
    background: #fff8d1; font-weight: 600;
  }
  table.trade-table tbody td.change-cell {
    background: #fafbfd;
  }

  /* ======= 공가세대 ======= */
  .empty-summary {
    background: #08213f; color: white; padding: 8px 10px;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center;
  }
  .empty-summary .item { border-right: 1px solid #265e99; padding: 2px 0; }
  .empty-summary .item:last-child { border-right: none; }
  .empty-summary .item .num {
    font-size: 22px; font-weight: 700; color: #fdbb31; line-height: 1.1;
  }
  .empty-summary .item .num .small {
    font-size: 12px; color: #c8cdd4; font-weight: 400; margin-left: 2px;
  }
  .empty-summary .item .lbl { font-size: 10.5px; color: #c8cdd4; margin-top: 3px; }

  table.empty-status-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  table.empty-status-table th, table.empty-status-table td {
    border: 1px solid #c8cdd4; padding: 7px 10px; text-align: center; height: 30px;
  }
  table.empty-status-table thead th {
    background: #1a4a7a; color: white; font-weight: 600; font-size: 11.5px;
  }
  table.empty-status-table thead th.sub-처리 { background: #265e99; }
  table.empty-status-table thead th.sub-미처리 { background: #b03030; }
  table.empty-status-table tbody td.label-cell {
    background: #f7f8fa; font-weight: 700; text-align: center;
    color: #08213f;
  }
  table.empty-status-table tbody td.{ background: #fff8d1; }
  table.empty-status-table tbody tr.sum-row td {
    background: #08213f; color: white; font-weight: 700;
  }
  table.empty-status-table tbody tr.sum-row td.label-cell {
    background: #08213f; color: white;
  }

  /* 공가 미처리 상위 공종 표 */
  .empty-trades-wrapper { padding: 8px; }
  table.empty-trades-table {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  table.empty-trades-table th, table.empty-trades-table td {
    border: 1px solid #c8cdd4; padding: 7px 10px; text-align: center; height: 32px;
  }
  table.empty-trades-table thead th {
    background: #1a4a7a; color: white; font-weight: 600; font-size: 11.5px;
  }
  table.empty-trades-table tbody td.rank {
    background: #08213f; color: white; font-weight: 700; width: 36px;
  }
  table.empty-trades-table tbody td.rank-etc { background: #08213f; }
  table.empty-trades-table tbody td.tname {
    background: #f7f8fa; font-weight: 700; text-align: left; padding-left: 10px;
    color: #08213f;
  }
  table.empty-trades-table tbody td.vname {
    text-align: left; padding-left: 10px; color: #4a5568;
  }
  table.empty-trades-table tbody tr.etc-row td { background: #f0f1f5; }
  table.empty-trades-table tbody tr.etc-row td.rank-etc { background: #08213f; }
  table.empty-trades-table tbody tr.etc-row td.tname { background: #e8eaef; }
  table.empty-trades-table tbody tr.sum-row td {
    background: #08213f; color: white; font-weight: 700;
  }
  table.empty-trades-table tbody tr.sum-row td.tname { background: #08213f; color: white; }
  table.empty-trades-table tbody tr.sum-row td.vname { background: #08213f; color: #c8cdd4; }

  /* ======= 분석 의견 섹션 ======= */
  .insight-wrapper { padding: 12px 14px; }
  .insight-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .insight-block {
    background: #f7f8fa;
    border-left: 3px solid #08213f;
    padding: 8px 12px;
  }
  .insight-block.warn { border-left-color: #961e1e; background: #fdf4f4; }
  .insight-block.good { border-left-color: #00a94f; background: #f0faf3; }
  .insight-block .ib-title {
    font-size: 14px; font-weight: 700; color: #08213f;
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .insight-block.warn .ib-title { color: #961e1e; }
  .insight-block.good .ib-title { color: #006e2e; }
  .insight-block .ib-tag {
    font-size: 10px; font-weight: 600;
    background: #08213f; color: white;
    padding: 1px 5px; border-radius: 2px;
  }
  .insight-block.warn .ib-tag { background: #961e1e; }
  .insight-block.good .ib-tag { background: #00a94f; }
  .insight-block .ib-body {
    font-size: 12.5px; color: #1a1a1a; line-height: 1.55;
  }
  .insight-block .ib-body strong { color: #08213f; }
  .insight-block.warn .ib-body strong { color: #961e1e; }
  .insight-block .ib-body .num-hl {
    font-weight: 700; color: #961e1e;
    font-variant-numeric: tabular-nums;
  }
  .insight-block .ib-body ul {
    margin: 4px 0 0 14px; padding: 0;
  }
  .insight-block .ib-body li {
    margin: 2px 0;
  }
  .action-block {
    background: #08213f; color: white;
    padding: 10px 14px; margin-top: 8px;
  }
  .action-block .ab-title {
    font-size: 15px; font-weight: 700; color: #fdbb31;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .action-block .ab-list {
    font-size: 12.5px; line-height: 1.65;
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px;
  }
  .action-block .ab-list .item {
    display: flex; align-items: baseline; gap: 6px;
  }
  .action-block .ab-list .num-circle {
    background: #fdbb31; color: #08213f;
    width: 18px; height: 18px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }
  .action-block .ab-list strong { color: #fdbb31; }

  /* 보수주체 분포 미니 차트 */
  .subject-bar {
    display: grid; grid-template-columns: 100px 1fr 60px; gap: 8px;
    align-items: center; margin: 3px 0; font-size: 11px;
  }
  .subject-bar .sb-label { color: #4a5568; font-weight: 600; }
  .subject-bar .sb-track {
    background: #e8eaef; height: 14px; position: relative; border-radius: 2px;
  }
  .subject-bar .sb-fill {
    height: 100%; border-radius: 2px;
    display: flex; align-items: center; padding-left: 6px;
    color: white; font-size: 10.5px; font-weight: 700;
  }
  .subject-bar .sb-meta {
    text-align: right; color: #4a5568; font-size: 10.5px;
    font-variant-numeric: tabular-nums;
  }

  /* ======= 섹션 호버 확대 + 클릭 모달 ======= */
  .db-expandable {
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(.25,.8,.25,1), box-shadow 0.18s;
    will-change: transform;
  }
  .db-expandable:hover {
    transform: scale(1.009);
    box-shadow: 0 4px 16px rgba(8,33,63,0.12);
    position: relative;
    z-index: 10;
  }
  .db-expandable:active { transform: scale(1.004); }

  /* KPI 카드 개별 호버 */
  .db-kpi-card.db-expandable {
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .db-kpi-card.db-expandable:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 14px rgba(8,33,63,0.14);
  }

  /* 이슈 카드, 도넛 카드, 권역 카드 개별 호버 */
  .db-issue-card.db-expandable,
  .db-donut-card.db-expandable,
  .db-region-card.db-expandable {
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .db-issue-card.db-expandable:hover,
  .db-donut-card.db-expandable:hover,
  .db-region-card.db-expandable:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 16px rgba(8,33,63,0.13);
    z-index: 10;
    position: relative;
  }

  /* SVG 차트 비율 고정 */
  .db-chart-wrap { position: relative; width: 100%; }
  .db-chart-wrap svg { display: block; width: 100%; height: auto; }
  .sidebar .dashboard-btn {
    display: flex; align-items: center; gap: 8px;
    margin: 0 12px 12px;
    padding: 9px 12px;
    background: linear-gradient(135deg, #fdbb31 0%, #f5a800 100%);
    color: #08213f;
    font-size: 12px; font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    border: none;
    letter-spacing: -0.3px;
    transition: all 0.15s;
    box-shadow: 0 2px 6px rgba(253,187,49,0.35);
  }
  .sidebar .dashboard-btn:hover {
    background: linear-gradient(135deg, #ffe066 0%, #fdbb31 100%);
    box-shadow: 0 3px 10px rgba(253,187,49,0.5);
    transform: translateY(-1px);
  }
  .sidebar .dashboard-btn.active {
    background: #fdbb31;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    transform: none;
  }
  .sidebar .dashboard-btn .db-icon { font-size: 15px; line-height: 1; }
  .sidebar .dashboard-btn .db-label { flex: 1; }
  .sidebar .dashboard-btn .db-badge {
    background: #08213f; color: #fdbb31;
    font-size: 9px; padding: 1px 5px; border-radius: 2px;
    font-weight: 700;
  }

  /* ======= 대시보드 패널 ======= */
  .db-kpi-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin-bottom: 8px;
  }
  .db-kpi-card {
    background: white; border: 1px solid #c8cdd4;
    padding: 10px 14px; position: relative; overflow: hidden;
  }
  .db-kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .db-kpi-card.navy::before { background: #08213f; }
  .db-kpi-card.red::before { background: #961e1e; }
  .db-kpi-card.green::before { background: #00a94f; }
  .db-kpi-card.yellow::before { background: #fdbb31; }

<script>
/* =====================================================================
 * 하자처리 현황 분석 엔진 (analyze.py → JavaScript 이식)
 * 브라우저/Node 양쪽에서 동작. 입력: 엑셀 행 객체 배열. 출력: siteData JSON.
 * ===================================================================== */
(function (root) {
  'use strict';

  var DAY = 86400000;

  /* ---- 권역 등록부 (site_registry.md) ---- */
  var REGION_MAP = {
    '힐스테이트 두정역': '1권역',
    '힐스테이트 고덕 스카이시티': '1권역',
    '힐스테이트 평택 더퍼스트': '1권역',
    '힐스테이트 오산 더퍼스트': '1권역',
    '힐스테이트 지제역 퍼스티움': '1권역',
    '힐스테이트 유성': '2권역',
    '힐스테이트 가양 더와이즈': '2권역',
    '힐스테이트 도안 퍼스트': '2권역',
    '갑천1 트리풀시티 힐스테이트': '2권역',
    '라펜트힐': '광주 권역',
    '힐스테이트 첨단': '광주 권역',
    '힐스테이트 신용 더리버': '광주 권역',
    '힐스테이트 익산 더퍼스트': '광주 권역'
  };

  /* ---- 날짜 유틸 (타임존 안전: 모든 날짜를 UTC 자정 ms로 정규화) ---- */
  function toDayTS(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      return Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
    }
    if (typeof v === 'number') {
      // 엑셀 시리얼 날짜 (1899-12-30 기준)
      var ms = Math.round((v - 25569) * 86400 * 1000);
      var d = new Date(ms);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }
    var s = String(v).trim();
    if (!s) return null;
    var m = s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    var d2 = new Date(s);
    if (!isNaN(d2.getTime())) return Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
    return null;
  }

  function dayDiff(a, b) { return Math.round((a - b) / DAY); }
  function ymd(ts) {
    var d = new Date(ts);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  }
  function monthStart(y, m) { return Date.UTC(y, m - 1, 1); }      // m: 1-based
  function monthEndTS(y, m) { return Date.UTC(y, m, 0); }          // m: 1-based → 말일
  function r1(x) { return Math.round((x + 1e-9) * 10) / 10; }      // 소수1자리 반올림

  /* ---- 집계 유틸 ---- */
  function valueCounts(arr) {
    // [{key, count}] 내림차순. 동률은 첫 등장 순서 유지.
    var map = {}, order = [];
    for (var i = 0; i < arr.length; i++) {
      var k = arr[i];
      if (k === null || k === undefined || k === '') continue;
      k = String(k);
      if (!(k in map)) { map[k] = 0; order.push(k); }
      map[k]++;
    }
    var list = order.map(function (k, idx) { return { key: k, count: map[k], idx: idx }; });
    list.sort(function (a, b) { return b.count - a.count || a.idx - b.idx; });
    return list;
  }
  function mode(arr) {
    var vc = valueCounts(arr);
    return vc.length ? vc[0].key : null;
  }
  function mean(arr) {
    if (!arr.length) return 0;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  /* =====================================================================
   * 데이터 로드 + 정제
   * rows: 엑셀에서 읽은 행 객체 배열 (헤더 키 = 컬럼명)
   * ===================================================================== */
  function prepare(rows) {
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      // Dummy(공가 점검용) 제외
      if (r['공간'] === '공가(미분양/미입주)') continue;
      var rcv = toDayTS(r['접수일']);
      if (rcv === null) continue; // 접수일 없는 행은 분석 불가
      out.push({
        접수일: rcv,
        처리확인일: toDayTS(r['처리확인일']),
        현장: r['현장'],
        현장코드: r['현장코드'],
        동: r['동'],
        호: r['호'],
        입주상태: r['입주상태'],
        하자구분: r['하자구분'],
        공간: r['공간'],
        공종: r['공종'],
        시공업체: r['시공업체'],
        보수주체: r['보수주체']
      });
    }
    return out;
  }

  /* ---- 기준일 자동 감지: 접수일 최대값의 전월 말일 ---- */
  function detectBaseDate(data) {
    var maxTS = -Infinity;
    for (var i = 0; i < data.length; i++) if (data[i].접수일 > maxTS) maxTS = data[i].접수일;
    var d = new Date(maxTS);
    var firstOfMonth = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    return { base: firstOfMonth - DAY, max: maxTS };
  }

  /* ---- 기준일 시점 누계 통계 ---- */
  function calcStatus(data, baseDate, prevDate) {
    var received = [], proc = 0, unp = [];
    for (var i = 0; i < data.length; i++) {
      var row = data[i];
      if (row.접수일 > baseDate) continue;
      received.push(row);
      var done = row.처리확인일 !== null && row.처리확인일 <= baseDate;
      if (done) proc++;
      else unp.push(row);
    }
    var total = received.length;
    var rate = total > 0 ? proc / total : 0;

    var periodProc = 0;
    if (prevDate !== null && prevDate !== undefined) {
      for (var j = 0; j < data.length; j++) {
        var c = data[j].처리확인일;
        if (c !== null && c > prevDate && c <= baseDate) periodProc++;
      }
    }

    var normal = 0, d30 = 0, d60 = 0;
    for (var k = 0; k < unp.length; k++) {
      var delay = dayDiff(baseDate, unp[k].접수일);
      if (delay < 30) normal++;
      else if (delay < 60) d30++;
      else d60++;
    }
    var longTotal = d30 + d60;
    var totalUnp = unp.length;
    var longRatio = totalUnp > 0 ? longTotal / totalUnp : 0;

    return {
      전체접수: total,
      누계처리: proc,
      처리율: r1(rate * 100),
      기간처리: periodProc,
      일반하자: normal,
      d30_59: d30,
      d60: d60,
      장기소계: longTotal,
      장기비율: r1(longRatio * 100),
      미처리합계: totalUnp
    };
  }

  /* ---- 월별 통계 ---- */
  function monthlyStats(data, year, maxTS) {
    var results = [];
    var prevEnd = Date.UTC(year - 1, 11, 31);
    for (var month = 1; month <= 12; month++) {
      var ms = monthStart(year, month);
      var me = monthEndTS(year, month);
      if (ms > maxTS) break;
      var newReceived = 0;
      for (var i = 0; i < data.length; i++) {
        if (data[i].접수일 >= ms && data[i].접수일 <= me) newReceived++;
      }
      var st = calcStatus(data, me, prevEnd);
      st.label = month + '월';
      st.월별접수 = newReceived;
      results.push(st);
      prevEnd = me;
    }
    return results;
  }

  /* ---- 주차별 통계 (각 주 토요일 기준) ---- */
  function pandasWeekday(ts) {
    // 월=0 ... 일=6
    var js = new Date(ts).getUTCDay(); // 일=0..토=6
    return (js + 6) % 7;
  }
  function firstSaturday(fromTS) {
    var add = ((5 - pandasWeekday(fromTS)) % 7 + 7) % 7;
    return fromTS + add * DAY;
  }
  function weeklyStats(data, year, maxTS) {
    var results = [];
    var yearStart = Date.UTC(year, 0, 1);
    var firstSat = firstSaturday(yearStart);
    var prev = firstSat - 7 * DAY;
    var cur = firstSat;
    var limit = maxTS + 7 * DAY;
    while (cur <= limit) {
      var d = new Date(cur);
      var month = d.getUTCMonth() + 1;
      var firstOfMonth = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      var firstSatM = firstSaturday(firstOfMonth);
      var weekNum = Math.floor(dayDiff(cur, firstSatM) / 7) + 1;

      var newReceived = 0;
      for (var i = 0; i < data.length; i++) {
        if (data[i].접수일 > prev && data[i].접수일 <= cur) newReceived++;
      }
      var st = calcStatus(data, cur, prev);
      st.month = month;
      st.week = weekNum;
      st.주간접수 = newReceived;
      results.push(st);
      prev = cur;
      cur = cur + 7 * DAY;
    }
    return results;
  }

  /* ---- 연속 항목 간 증감 ---- */
  function addChange(items, key, changeKey) {
    for (var i = 0; i < items.length; i++) {
      items[i][changeKey] = (i === 0) ? null : (items[i][key] - items[i - 1][key]);
    }
    return items;
  }

  /* ---- 장기미처리 상위 N개 공종 ---- */
  function longTermTrades(data, baseDate, prevBaseDate, topN) {
    topN = topN || 5;
    function lt(d) {
      var res = [];
      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        if (row.접수일 > d) continue;
        var done = row.처리확인일 !== null && row.처리확인일 <= d;
        if (done) continue;
        if (dayDiff(d, row.접수일) >= 30) res.push(row);
      }
      return res;
    }
    var cur = lt(baseDate), prev = lt(prevBaseDate);
    var curCnt = valueCounts(cur.map(function (r) { return r.공종; }));
    var prevCnt = {};
    valueCounts(prev.map(function (r) { return r.공종; })).forEach(function (o) { prevCnt[o.key] = o.count; });

    var top = curCnt.slice(0, topN).map(function (o) { return o.key; });
    var rows = [];
    top.forEach(function (trade) {
      var sub = cur.filter(function (r) { return String(r.공종) === trade; });
      var vendor = sub.length ? (mode(sub.map(function (r) { return r.시공업체; })) || '-') : '-';
      var cNow = sub.length;
      var cPrev = prevCnt[trade] || 0;
      rows.push({ 공종: trade, 시공업체: vendor, 전월: cPrev, 금월: cNow, 증감: cNow - cPrev });
    });

    var topSet = {};
    top.forEach(function (t) { topSet[t] = 1; });
    var etcNow = cur.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcPrev = prev.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcTrades = valueCounts(etcNow.map(function (r) { return r.공종; }));
    var etcVendors = valueCounts(etcNow.map(function (r) { return r.시공업체; }));
    var sixthTrade = curCnt.length > topN ? curCnt[topN].key : null;
    var sixthVendor = etcVendors.length ? etcVendors[0].key : null;

    return {
      상위: rows,
      기타: {
        공종_라벨: (sixthTrade && etcTrades.length > 0)
          ? (sixthTrade + ' 외 ' + (etcTrades.length - 1) + '개 공종') : '기타',
        시공업체_라벨: (sixthVendor && etcVendors.length > 0)
          ? (sixthVendor + ' 외 ' + (etcVendors.length - 1) + '개사') : '다수',
        전월: etcPrev.length,
        금월: etcNow.length,
        증감: etcNow.length - etcPrev.length
      },
      합계: { 전월: prev.length, 금월: cur.length, 증감: cur.length - prev.length }
    };
  }

  /* ---- 공가세대 처리현황 ---- */
  function emptyUnitStats(data, baseDate, topN) {
    topN = topN || 5;
    var empty = data.filter(function (r) {
      return r.하자구분 === '세대' && (r.입주상태 === '미분양' || r.입주상태 === '미납');
    });
    var received = [], processed = [], unp = [];
    empty.forEach(function (r) {
      if (r.접수일 > baseDate) return;
      received.push(r);
      var done = r.처리확인일 !== null && r.처리확인일 <= baseDate;
      if (done) processed.push(r); else unp.push(r);
    });

    function group(state) {
      var rec = received.filter(function (r) { return r.입주상태 === state; });
      var proc = processed.filter(function (r) { return r.입주상태 === state; });
      var u = unp.filter(function (r) { return r.입주상태 === state; });
      var hh = {};
      empty.forEach(function (r) {
        if (r.입주상태 === state) hh[String(r.동) + '|' + String(r.호)] = 1;
      });
      var normal = 0, d30 = 0, d60 = 0;
      u.forEach(function (r) {
        var delay = dayDiff(baseDate, r.접수일);
        if (delay < 30) normal++; else if (delay < 60) d30++; else d60++;
      });
      return {
        상태: state, 세대수: Object.keys(hh).length,
        접수: rec.length, 처리: proc.length,
        처리율: rec.length > 0 ? r1(proc.length / rec.length * 100) : 0,
        일반: normal, d30_59: d30, d60: d60, 미처리합계: u.length
      };
    }
    var misun = group('미분양'), minab = group('미납');
    var sumRec = misun.접수 + minab.접수, sumProc = misun.처리 + minab.처리;

    var cnt = valueCounts(unp.map(function (r) { return r.공종; }));
    var topTrades = [];
    cnt.slice(0, topN).forEach(function (o) {
      var sub = unp.filter(function (r) { return String(r.공종) === o.key; });
      var vendor = sub.length ? (mode(sub.map(function (r) { return r.시공업체; })) || '-') : '-';
      topTrades.push({ 공종: o.key, 시공업체: vendor, 미처리: o.count });
    });
    var topSet = {};
    topTrades.forEach(function (t) { topSet[t.공종] = 1; });
    var etc = unp.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcTrades = valueCounts(etc.map(function (r) { return r.공종; }));
    var etcVendors = valueCounts(etc.map(function (r) { return r.시공업체; }));
    var sixthTrade = cnt.length > topN ? cnt[topN].key : null;
    var sixthVendor = etcVendors.length ? etcVendors[0].key : null;

    return {
      미분양: misun, 미납: minab,
      합계: {
        세대수: misun.세대수 + minab.세대수,
        접수: sumRec, 처리: sumProc,
        처리율: sumRec > 0 ? r1(sumProc / sumRec * 100) : 0,
        일반: misun.일반 + minab.일반,
        d30_59: misun.d30_59 + minab.d30_59,
        d60: misun.d60 + minab.d60,
        미처리합계: misun.미처리합계 + minab.미처리합계
      },
      상위공종: topTrades,
      기타공종: {
        공종_라벨: (sixthTrade && etcTrades.length > 0)
          ? (sixthTrade + ' 외 ' + (etcTrades.length - 1) + '개 공종') : '기타',
        시공업체_라벨: (sixthVendor && etcVendors.length > 0)
          ? (sixthVendor + ' 외 ' + (etcVendors.length - 1) + '개사') : '다수',
        미처리: etc.length
      }
    };
  }

  /* ---- CS팀장 분석 의견 데이터 ---- */
  function analysisInsights(data, baseDate, maxTS) {
    var received = [], unp = [];
    data.forEach(function (r) {
      if (r.접수일 > baseDate) return;
      received.push(r);
      var done = r.처리확인일 !== null && r.처리확인일 <= baseDate;
      if (!done) unp.push(r);
    });
    var totalUnp = unp.length;
    unp.forEach(function (r) { r._delay = dayDiff(baseDate, r.접수일); });

    // 보수주체 분포
    var subjects = {};
    valueCounts(unp.map(function (r) { return r.보수주체; })).forEach(function (o) {
      var sub = unp.filter(function (r) { return String(r.보수주체) === o.key; });
      subjects[o.key] = {
        건수: sub.length,
        비율: totalUnp > 0 ? r1(sub.length / totalUnp * 100) : 0,
        평균지연: sub.length ? Math.trunc(mean(sub.map(function (r) { return r._delay; }))) : 0
      };
    });

    // 협력사별 처리율 (접수 50건 이상)
    var vendorStats = {};
    valueCounts(received.map(function (r) { return r.시공업체; })).forEach(function (o) {
      if (o.count < 50) return;
      var rec = received.filter(function (r) { return String(r.시공업체) === o.key; });
      var proc = rec.filter(function (r) {
        return r.처리확인일 !== null && r.처리확인일 <= baseDate;
      });
      var u = unp.filter(function (r) { return String(r.시공업체) === o.key; });
      vendorStats[o.key] = {
        접수: rec.length,
        처리율: r1(proc.length / rec.length * 100),
        미처리: u.length,
        장기미처리: u.filter(function (r) { return r._delay >= 30; }).length,
        평균지연: u.length ? Math.trunc(mean(u.map(function (r) { return r._delay; }))) : 0
      };
    });
    var lowVendors = Object.keys(vendorStats)
      .map(function (k) { return [k, vendorStats[k]]; })
      .sort(function (a, b) { return a[1].처리율 - b[1].처리율; })
      .slice(0, 3);

    // 60일 이상 적체
    var over60 = unp.filter(function (r) { return r._delay >= 60; });
    var over60Delays = over60.map(function (r) { return r._delay; });
    var over60Stats = {
      건수: over60.length,
      비율: totalUnp > 0 ? r1(over60.length / totalUnp * 100) : 0,
      평균지연: over60.length ? Math.trunc(mean(over60Delays)) : 0,
      최대지연: over60.length ? Math.max.apply(null, over60Delays) : 0,
      d90: over60.filter(function (r) { return r._delay >= 90; }).length,
      d180: over60.filter(function (r) { return r._delay >= 180; }).length,
      d365: over60.filter(function (r) { return r._delay >= 365; }).length
    };

    // 월별 신규 접수
    var monthlyNew = {};
    var baseYear = new Date(baseDate).getUTCFullYear();
    for (var m = 1; m <= 12; m++) {
      var ms = monthStart(baseYear, m), me = monthEndTS(baseYear, m);
      if (ms > maxTS) break;
      var c = 0;
      data.forEach(function (r) { if (r.접수일 >= ms && r.접수일 <= me) c++; });
      monthlyNew[m + '월'] = c;
    }

    return {
      보수주체: subjects,
      협력사: vendorStats,
      저조협력사: lowVendors,
      d60이상: over60Stats,
      월별신규접수: monthlyNew,
      총미처리: totalUnp
    };
  }

  /* =====================================================================
   * 메인: 엑셀 행 배열 → siteData
   * ===================================================================== */
  function analyze(rows, opts) {
    opts = opts || {};
    var data = prepare(rows);
    if (!data.length) throw new Error('분석할 데이터가 없습니다. (접수일/공간 컬럼 확인)');

    var siteName = mode(data.map(function (r) { return r.현장; }));
    var siteCode = mode(data.map(function (r) { return r.현장코드; }));

    var bd = detectBaseDate(data);
    var baseDate = bd.base, maxTS = bd.max;
    var year = opts.year || new Date(maxTS).getUTCFullYear();

    var monthly = monthlyStats(data, year, maxTS);
    addChange(monthly, '미처리합계', '합계증감');
    addChange(monthly, '장기소계', '장기증감');
    addChange(monthly, '기간처리', '처리증감');

    var weekly = weeklyStats(data, year, maxTS);
    addChange(weekly, '미처리합계', '합계증감');
    addChange(weekly, '장기소계', '장기증감');
    addChange(weekly, '기간처리', '처리증감');

    var bdD = new Date(baseDate);
    var prevBase = Date.UTC(bdD.getUTCFullYear(), bdD.getUTCMonth(), 1) - DAY;

    var trades = longTermTrades(data, baseDate, prevBase, 5);
    var empty = emptyUnitStats(data, baseDate, 5);
    var insights = analysisInsights(data, baseDate, maxTS);

    return {
      현장명: siteName,
      현장코드: siteCode,
      권역: REGION_MAP[siteName] || null,
      기준일: ymd(baseDate),
      데이터_최대일: ymd(maxTS),
      연도: year,
      행수: data.length,
      월별: monthly,
      주차별: weekly,
      장기미처리공종: trades,
      공가세대: empty,
      분석: insights
    };
  }

  var API = {
    analyze: analyze,
    prepare: prepare,
    toDayTS: toDayTS,
    REGION_MAP: REGION_MAP,
    _internal: {
      detectBaseDate: detectBaseDate, calcStatus: calcStatus,
      monthlyStats: monthlyStats, weeklyStats: weeklyStats,
      longTermTrades: longTermTrades, emptyUnitStats: emptyUnitStats,
      analysisInsights: analysisInsights
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.DefectEngine = API;

})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* =====================================================================
 * 리포트 렌더러 (build_report.py render_chart/render_panel → JavaScript)
 * siteData → 실제 리포트 패널 HTML. 현재 index.html 패널 구조를 그대로 재현.
 * ===================================================================== */
(function (root) {
  'use strict';

  function fmt(n) {
    if (n === null || n === undefined || n === '') return '—';
    if (typeof n === 'number') return n.toLocaleString('ko-KR');
    return String(n);
  }
  function changeStr(d) {
    if (d === null || d === undefined) return '—';
    if (d > 0) return '+' + d.toLocaleString('ko-KR');
    if (d < 0) return '−' + Math.abs(d).toLocaleString('ko-KR');
    return '0';
  }
  function changeCls(d) {
    if (d === null || d === undefined || d === 0) return 'change-zero';
    return d > 0 ? 'change-up' : 'change-down';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* ===================== SVG 차트 ===================== */
  function renderChart(weekly) {
    var W = 1480, H = 340;
    var M = { top: 35, right: 90, bottom: 60, left: 65 };
    var plotW = W - M.left - M.right, plotH = H - M.top - M.bottom;
    var n = weekly.length;
    var barSlot = n > 0 ? plotW / n : 1;
    var barW = barSlot * 0.6;

    var maxUnp = 3500;
    weekly.forEach(function (w) { if (w.미처리합계 > maxUnp) maxUnp = w.미처리합계; });
    var yMaxLeft = ((Math.floor(maxUnp * 1.2 / 500)) + 1) * 500;

    var allR = weekly.map(function (w) { return w.전체접수; });
    var allP = weekly.map(function (w) { return w.누계처리; });
    var minV = allP.length ? Math.min.apply(null, allP) : 0;
    var maxV = allR.length ? Math.max.apply(null, allR) : 100000;
    var yMinRight = Math.floor(minV / 1000) * 1000 - 1000;
    var yMaxRight = (Math.floor(maxV / 1000) + 2) * 1000;

    function by(v) { return M.top + plotH * (1 - v / yMaxLeft); }
    function ly(v) { return M.top + plotH * (1 - (v - yMinRight) / (yMaxRight - yMinRight)); }
    function f1(x) { return x.toFixed(1); }

    var C_NORMAL = '#c3d7e9', C_LONG = '#ecadad';
    var T_NORMAL = '#08213f', T_LONG = '#5a0c0c';
    var L_RECEIVED = '#fdbb31', L_PROCESSED = '#265e99';
    var s = [];
    s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;">');
    s.push('<defs><filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">');
    s.push('<feDropShadow dx="0.6" dy="0.6" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.85"/></filter></defs>');
    s.push('<rect x="' + M.left + '" y="' + M.top + '" width="' + plotW + '" height="' + plotH + '" fill="white" stroke="#08213f" stroke-width="1"/>');

    var step = Math.floor(yMaxLeft / 5);
    s.push('<g stroke="#d1d5db" stroke-width="0.5" stroke-dasharray="2,2">');
    for (var tv = step; tv < yMaxLeft; tv += step) {
      s.push('<line x1="' + M.left + '" y1="' + f1(by(tv)) + '" x2="' + (W - M.right) + '" y2="' + f1(by(tv)) + '"/>');
    }
    s.push('</g>');
    s.push('<g stroke="#eef0f3" stroke-width="0.5">');
    for (var i = 1; i < n; i++) {
      var x = M.left + barSlot * i;
      s.push('<line x1="' + f1(x) + '" y1="' + M.top + '" x2="' + f1(x) + '" y2="' + (M.top + plotH) + '"/>');
    }
    s.push('</g>');

    s.push('<g font-family="Malgun Gothic, sans-serif" font-size="11" fill="#4a5568" text-anchor="end">');
    for (var tv2 = 0; tv2 <= yMaxLeft; tv2 += step) {
      s.push('<text x="' + (M.left - 8) + '" y="' + f1(by(tv2) + 4) + '">' + tv2.toLocaleString('en-US') + '</text>');
    }
    s.push('</g>');
    s.push('<text x="' + M.left + '" y="' + (M.top - 12) + '" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#08213f" font-weight="700">미처리(건)</text>');

    s.push('<g font-family="Malgun Gothic, sans-serif" font-size="11" fill="#4a5568" text-anchor="start">');
    var rstep = Math.floor((yMaxRight - yMinRight) / 4);
    for (var tv3 = yMinRight; tv3 <= yMaxRight; tv3 += rstep) {
      var label = tv3 >= 1000 ? (Math.floor(tv3 / 1000) + 'K') : String(tv3);
      s.push('<text x="' + (W - M.right + 8) + '" y="' + f1(ly(tv3) + 4) + '">' + label + '</text>');
    }
    s.push('</g>');
    s.push('<text x="' + (W - M.right) + '" y="' + (M.top - 12) + '" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#08213f" font-weight="700">접수·처리(건)</text>');

    weekly.forEach(function (w, i) {
      var cx = M.left + barSlot * (i + 0.5);
      var bx = cx - barW / 2;
      var normalH = plotH * (w.일반하자 / yMaxLeft);
      var longH = plotH * (w.장기소계 / yMaxLeft);
      var yNormal = M.top + plotH - normalH;
      s.push('<rect x="' + f1(bx) + '" y="' + f1(yNormal) + '" width="' + f1(barW) + '" height="' + f1(normalH) + '" fill="' + C_NORMAL + '"/>');
      var yLong = yNormal - longH;
      s.push('<rect x="' + f1(bx) + '" y="' + f1(yLong) + '" width="' + f1(barW) + '" height="' + f1(longH) + '" fill="' + C_LONG + '"/>');
      if (normalH >= 14) s.push('<text x="' + f1(cx) + '" y="' + f1(yNormal + normalH / 2 + 4) + '" font-family="Malgun Gothic, sans-serif" font-size="10.5" fill="' + T_NORMAL + '" font-weight="700" text-anchor="middle">' + w.일반하자.toLocaleString('en-US') + '</text>');
      if (longH >= 14) s.push('<text x="' + f1(cx) + '" y="' + f1(yLong + longH / 2 + 4) + '" font-family="Malgun Gothic, sans-serif" font-size="10.5" fill="' + T_LONG + '" font-weight="700" text-anchor="middle">' + w.장기소계.toLocaleString('en-US') + '</text>');
      s.push('<text x="' + f1(cx) + '" y="' + f1(yLong - 6) + '" font-family="Malgun Gothic, sans-serif" font-size="11" fill="#08213f" font-weight="700" text-anchor="middle">' + w.미처리합계.toLocaleString('en-US') + '</text>');
      s.push('<text x="' + f1(cx) + '" y="' + f1(M.top + plotH + 16) + '" font-family="Malgun Gothic, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle">' + w.month + '월</text>');
      s.push('<text x="' + f1(cx) + '" y="' + f1(M.top + plotH + 30) + '" font-family="Malgun Gothic, sans-serif" font-size="10.5" fill="#4a5568" text-anchor="middle">' + w.week + '주</text>');
    });

    var ptsR = weekly.map(function (w, i) { return f1(M.left + barSlot * (i + 0.5)) + ',' + f1(ly(w.전체접수)); }).join(' ');
    var ptsP = weekly.map(function (w, i) { return f1(M.left + barSlot * (i + 0.5)) + ',' + f1(ly(w.누계처리)); }).join(' ');
    s.push('<polyline points="' + ptsR + '" fill="none" stroke="' + L_RECEIVED + '" stroke-width="2.4"/>');
    s.push('<polyline points="' + ptsP + '" fill="none" stroke="' + L_PROCESSED + '" stroke-width="2.4"/>');
    weekly.forEach(function (w, i) {
      var cx = M.left + barSlot * (i + 0.5);
      s.push('<circle cx="' + f1(cx) + '" cy="' + f1(ly(w.전체접수)) + '" r="3" fill="' + L_RECEIVED + '" stroke="white" stroke-width="1.2"/>');
      s.push('<circle cx="' + f1(cx) + '" cy="' + f1(ly(w.누계처리)) + '" r="3" fill="' + L_PROCESSED + '" stroke="white" stroke-width="1.2"/>');
    });

    if (weekly.length) {
      var first = weekly[0], last = weekly[weekly.length - 1];
      var cxF = M.left + barSlot * 0.5, cxL = M.left + barSlot * (n - 0.5);
      [[cxF + 25, ly(first.전체접수), first.전체접수, L_RECEIVED, 'start', -2],
       [cxF + 25, ly(first.누계처리), first.누계처리, L_PROCESSED, 'start', 8],
       [cxL - 8, ly(last.전체접수), last.전체접수, L_RECEIVED, 'end', -2],
       [cxL - 8, ly(last.누계처리), last.누계처리, L_PROCESSED, 'end', 12]
      ].forEach(function (a) {
        s.push('<text x="' + f1(a[0]) + '" y="' + f1(a[1] + a[5]) + '" font-family="Malgun Gothic, sans-serif" font-size="11" fill="' + a[3] + '" font-weight="700" text-anchor="' + a[4] + '" filter="url(#textShadow)" stroke="white" stroke-width="2.5" paint-order="stroke fill">' + a[2].toLocaleString('en-US') + '</text>');
      });
    }
    var lx = M.left, lyv = H - 12;

  /* ===================== 표 행 빌더 ===================== */
  function statRow(m, labelHtml, periodKey) {
    var cp = changeCls(m.처리증감), cl = changeCls(m.장기증감), cs = changeCls(m.합계증감);
    return '<tr>' + labelHtml +
      '<td class="num">' + fmt(m.전체접수) + '</td>' +
      '<td class="num" style="background:#e8f1fb;font-weight:600;">' + fmt(m[periodKey]) + '</td>' +
      '<td class="num">' + fmt(m.누계처리) + '</td>' +
      '<td class="num rate">' + m.처리율 + '%</td>' +
      '<td class="num proc-current">' + fmt(m.기간처리) + '</td>' +
      '<td class="num proc-current ' + cp + '">' + changeStr(m.처리증감) + '</td>' +
      '<td class="num">' + fmt(m.일반하자) + '</td>' +
      '<td class="num">' + fmt(m.d30_59) + '</td>' +
      '<td class="num">' + fmt(m.d60) + '</td>' +
      '<td class="num">' + fmt(m.장기소계) + '</td>' +
      '<td class="num">' + m.장기비율 + '%</td>' +
      '<td class="num ' + cl + '">' + changeStr(m.장기증감) + '</td>' +
      '<td class="num sum-cell">' + fmt(m.미처리합계) + '</td>' +
      '<td class="num sum-cell ' + cs + '">' + changeStr(m.합계증감) + '</td></tr>';
  }

  function monthlyRows(monthly) {
    return monthly.map(function (m) {
      return statRow(m, '<td class="label-cell">' + esc(m.label) + '</td>', '월별접수');
    }).join('\n');
  }

  function weeklyRows(weekly) {
    var byMonth = {};
    weekly.forEach(function (w) { (byMonth[w.month] = byMonth[w.month] || []).push(w); });
    var months = Object.keys(byMonth).map(Number).sort(function (a, b) { return a - b; });
    var out = [];
    months.forEach(function (mo) {
      var list = byMonth[mo];
      list.forEach(function (w, i) {
        var mcell = (i === 0)
          ? '<td class="month-label" rowspan="' + list.length + '">' + mo + '월</td>' : '';
        out.push(statRow(w, mcell + '<td class="label-cell">' + w.week + '주</td>', '주간접수'));
      });
    });
    return out.join('\n');
  }

  /* ===================== 분석 의견 (insight_rules.md) ===================== */
  function renderInsight(insights) {
    var subj = insights.보수주체;
    var colorMap = { '시공업체': '#961e1e', '품의(대기)': '#b03030', '외주': '#7a1818', 'H서비스센터': '#1a4a7a' };
    var bars = [];
    ['시공업체', '품의(대기)', '외주', 'H서비스센터'].forEach(function (k) {
      if (!subj[k]) return;
      var d = subj[k], c = colorMap[k] || '#4a5568';
      bars.push('<div class="subject-bar"><div class="sb-label">' + k + '</div>' +
        '<div class="sb-track"><div class="sb-fill" style="background:' + c + '; width:' + d.비율 + '%;">' + fmt(d.건수) + '건</div></div>' +
        '<div class="sb-meta">' + d.비율 + '% · 평균지연 ' + d.평균지연 + '일</div></div>');
    });

    var boxes = [];
    // 경고 1: 저조 협력사
    if (insights.저조협력사.length) {
      var lv = insights.저조협력사[0], v = lv[1];
      boxes.push('<div class="insight-block warn">' +
        '<div class="ib-title"><span class="ib-tag">경고</span>' + esc(lv[0]) + ' — 처리율 단독 저조</div>' +
        '<div class="ib-body">접수 ' + fmt(v.접수) + '건 중 처리율 <span class="num-hl">' + v.처리율 + '%</span>로 타 협력사 대비 낮음. 미처리 ' + fmt(v.미처리) + '건 중 <span class="num-hl">' + fmt(v.장기미처리) + '건이 장기미처리</span>이며 평균 지연 ' + v.평균지연 + '일.</div></div>');
    }
    // 경고 2: 60일 이상
    var o = insights.d60이상;
    boxes.push('<div class="insight-block warn">' +
      '<div class="ib-title"><span class="ib-tag">경고</span>60일 이상 장기미처리 ' + fmt(o.건수) + '건 — 적체</div>' +
      '<div class="ib-body">전체 미처리의 <span class="num-hl">' + o.비율 + '%</span>가 60일 이상. 평균 지연 ' + o.평균지연 + '일, 최대 ' + o.최대지연 + '일. 90일 이상 ' + fmt(o.d90) + '건, 180일 이상 ' + fmt(o.d180) + '건, 1년 이상 ' + fmt(o.d365) + '건.</div></div>');
    // 호조/의견: 월별 신규접수 추이
    var mn = insights.월별신규접수;
    var keys = Object.keys(mn);
    if (keys.length >= 2) {
      var fm = keys[0], lm = keys[keys.length - 1];
      var fv = mn[fm], lv2 = mn[lm];
      var decline = fv > 0 ? Math.round((fv - lv2) / fv * 100) : 0;
      if (decline >= 30) {
        boxes.push('<div class="insight-block good">' +
          '<div class="ib-title"><span class="ib-tag">호조</span>신규 접수 안정화 — 입주 초기 피크 지나는 중</div>' +
          '<div class="ib-body">월별 신규 접수 ' + fm + ' <strong>' + fmt(fv) + '건</strong> → ' + lm + ' <strong>' + fmt(lv2) + '건</strong> (' + decline + '% 감소). 일반하자 잔량도 감소 추세로 장기 적체 해소에 자원 집중 가능.</div></div>');
      } else {
        boxes.push('<div class="insight-block" style="border-left-color:#265e99;background:#ebf2fa;">' +
          '<div class="ib-title"><span class="ib-tag" style="background:#265e99;">의견</span>신규 접수 추이 — 처리·적체 병행 관리</div>' +
          '<div class="ib-body">월별 신규 접수 ' + fm + ' <strong>' + fmt(fv) + '건</strong> → ' + lm + ' <strong>' + fmt(lv2) + '건</strong>. 60일 이상 장기 ' + fmt(o.건수) + '건(' + o.비율 + '%) 적체와 신규 유입을 병행 관리해야 하며, 협력사별 목표 배정 및 주간 모니터링 강화 요망.</div></div>');
      }
    }

    return '<div class="insight-wrapper">' +
      '<div class="insight-block" style="margin-bottom: 12px; border-left-color: #265e99; background: #ebf2fa;">' +
      '<div class="ib-title" style="color: #08213f;"><span class="ib-tag" style="background: #265e99;">진단</span>보수주체별 미처리 분포</div>' +
      '<div class="ib-body">' + bars.join('') + '</div></div>' +
      '<div class="insight-grid">' + boxes.join('') + '</div></div>';
  }

    // 4. 공가상가 처리현황 (현재 리포트: 단일 행)
    var longCnt = e.d30_59 + e.d60;
    html += '<div class="section"><div class="section-title"><span class="badge">04</span><span>공가상가 하자 처리현황</span></div>' +
      '<div class="empty-summary">' +
      '<div class="item"><div class="num">' + fmt(e.세대수) + '<span class="small">호실</span></div><div class="lbl">공가상가 (' + d.기준일.slice(0, 7) + ' 시점)</div></div>' +
      '<div class="item"><div class="num">' + fmt(e.접수) + '<span class="small">건</span></div><div class="lbl">누계 접수</div></div>' +
      '<div class="item"><div class="num">' + fmt(e.처리) + '<span class="small">건</span></div><div class="lbl">처리 완료</div></div>' +
      '<div class="item"><div class="num">' + e.처리율 + '<span class="small">%</span></div><div class="lbl">처리율</div></div>' +
      '<div class="item"><div class="num">' + fmt(e.미처리합계) + '<span class="small">건</span></div><div class="lbl">미처리 (장기 ' + longCnt + ')</div></div></div>' +
      '<table class="empty-status-table"><thead><tr>' +
      '<th rowspan="2" style="width:90px;">구분</th><th rowspan="2" style="width:80px;">호실수<br>(' + d.기준일.slice(0, 7) + ' 시점)</th>' +
      '<th rowspan="2" style="width:70px;">누계<br>접수</th><th class="sub-처리" colspan="2">처리</th><th class="sub-미처리" colspan="4">미처리</th></tr>' +
      '<tr><th class="sub-처리" style="width:60px;">건수</th><th class="sub-처리" style="width:60px;">처리율</th>' +
      '<th class="sub-미처리" style="width:80px;">30일 미만</th><th class="sub-미처리" style="width:60px;">30~59일</th>' +
      '<th class="sub-미처리" style="width:70px;">60일 이상</th><th class="sub-미처리" style="width:60px;">합계</th></tr></thead>' +
      '<tbody><tr><td class="label-cell">공가상가</td>' +
      '<td class="num">' + fmt(e.세대수) + '</td><td class="num">' + fmt(e.접수) + '</td>' +
      '<td class="num">' + fmt(e.처리) + '</td><td class="num rate">' + e.처리율 + '%</td>' +
      '<td class="num">' + fmt(e.일반) + '</td><td class="num">' + fmt(e.d30_59) + '</td>' +
      '<td class="num">' + fmt(e.d60) + '</td>' +
      '<td class="num" style="color:#961e1e;font-weight:700;">' + fmt(e.미처리합계) + '</td></tr></tbody></table></div>';

    // 5. 공가상가 미처리 공종
    html += '<div class="section"><div class="section-title"><span class="badge">05</span><span>공가상가 미처리 상위 5개 공종</span></div>' +
      '<table class="trade-table" style="table-layout: fixed;">' + tradeColgroup +
      '<thead><tr><th rowspan="2">순위</th><th rowspan="2">공종</th><th rowspan="2">시공업체</th><th class="group-month" colspan="2">공가상가 미처리 건수</th><th rowspan="2">대비<br>증감</th><th rowspan="2">처리계획 / 비고</th></tr><tr><th>전월</th><th>금월</th></tr></thead>' +
      '<tbody>' + emptyTradeRows(d.공가세대, panelId) + '</tbody></table></div>';

    // 6. 분석 의견
    html += '<div class="section"><div class="section-title"><span class="badge">06</span><span>분석 의견 및 현장 지시사항</span></div>' +
      renderInsight(d.분석) + '</div>';

    // 7. 팀장 종합 의견
    html += '<div class="section" style="margin:8px 0 0;">' +
      '<div class="section-title" style="background:#08213f;color:white;padding:6px 12px;display:flex;align-items:center;gap:8px;">' +
      '<span class="badge" style="background:rgba(255,255,255,0.2);color:white;">✎</span><span style="color:white;">팀장 종합 의견 및 지시사항</span></div>' +
      '<div class="team-opinion-section" style="border:1px solid #e2e8f0;border-top:none;border-radius:0 0 3px 3px;overflow:hidden;">' +
      '<div class="team-opinion-body" contenteditable="true" data-panel-id="' + panelId + '" style="padding:12px 14px;min-height:72px;font-size:12px;line-height:1.7;color:#374151;outline:none;white-space:pre-wrap;background:white;"></div>' +
      '</div></div>';

    return html;
  }

  var API = { renderPanelInner: renderPanelInner, renderChart: renderChart };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.DefectRenderer = API;

})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* ===== UI: 엑셀 → 분석 → 패널 렌더링 ===== */
(function () {
  'use strict';
  var fileInput = document.getElementById('genFile');
  var pickBtn   = document.getElementById('genPick');
  var drop      = document.getElementById('genDrop');
  var statusEl  = document.getElementById('genStatus');
  var host      = document.getElementById('panelHost');

  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

  pickBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function findHeaderRow(aoa) {
    for (var i = 0; i < Math.min(aoa.length, 10); i++) {
      var row = aoa[i] || [], a = false, b = false;
      for (var j = 0; j < row.length; j++) {
        var v = String(row[j] || '').trim();
        if (v === '접수일') a = true;
        if (v === '현장') b = true;
      }
      if (a && b) return i;
    }
    return 3;
  }

  function handleFile(file) {
    setStatus('"' + file.name + '" 분석 중...', '');
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
        var hIdx = findHeaderRow(aoa);
        var header = aoa[hIdx];
        var rows = aoa.slice(hIdx + 1)
          .filter(function (r) { return r && r.some(function (c) { return c !== null && c !== ''; }); })
          .map(function (r) {
            var o = {};
            header.forEach(function (h, i) { if (h != null) o[String(h).trim()] = r[i]; });
            return o;
          });
        if (!rows.length) throw new Error('데이터 행을 찾지 못했습니다.');

        var data = window.DefectEngine.analyze(rows);
        var inner = window.DefectRenderer.renderPanelInner(data, 'panel_preview', {});
        host.innerHTML = '<div class="site-panel active" id="panel_preview" ' +
          'data-site-code="' + data.현장코드 + '" data-base-date="' + data.기준일 + '">' + inner + '</div>';

        wireToggles();
        setStatus('✓ 생성 완료 — ' + data.현장명 + ' · 기준일 ' + data.기준일 +
          ' · 유효 ' + data.행수.toLocaleString('ko-KR') + '행 (Dummy 제외)', 'ok');
        window.scrollTo({ top: drop.offsetHeight, behavior: 'smooth' });
      } catch (err) {
        console.error(err);
        setStatus('✗ 오류: ' + err.message, 'err');
        host.innerHTML = '';
      }
    };
    reader.onerror = function () { setStatus('✗ 파일을 읽지 못했습니다.', 'err'); };
    reader.readAsArrayBuffer(file);
  }

  /* 월별/주차별 접기·펼치기 (실제 리포트와 동일 동작) */
  function wireToggles() {
    host.querySelectorAll('.collapsible-table').forEach(function (t) { t.style.display = 'block'; });
    host.querySelectorAll('.toggle-btn').forEach(function (btn) {
      btn.textContent = '−';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var w = this.closest('.section').querySelector('.collapsible-table');
        if (!w) return;
        var hidden = w.style.display === 'none';
        w.style.display = hidden ? 'block' : 'none';
        this.textContent = hidden ? '−' : '+';
      });
    });
  }
})();
</script>
</body>
</html>
