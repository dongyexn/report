<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하자 분석 엔진 — 검증 도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
    background: #f5f6f8; color: #1a1a1a; font-size: 13px; padding: 20px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .top {
    background: #08213f; color: white; padding: 16px 20px; border-radius: 6px 6px 0 0;
  }
  .top h1 { font-size: 18px; font-weight: 700; }
  .top .sub { font-size: 11.5px; color: #c8cdd4; margin-top: 3px; }
  .drop {
    background: white; border: 2px dashed #c8cdd4; border-bottom: none;
    padding: 28px 20px; text-align: center; transition: background .15s, border-color .15s;
  }
  .drop.over { background: #ebf2fa; border-color: #265e99; }
  .drop .big { font-size: 14px; font-weight: 700; color: #08213f; margin-bottom: 6px; }
  .drop .small { font-size: 11.5px; color: #6b7280; margin-bottom: 12px; }
  .btn {
    background: #08213f; color: white; border: none; padding: 9px 20px;
    border-radius: 4px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #265e99; }
  .btn.ghost { background: white; color: #08213f; border: 1px solid #08213f; }
  .btn.ghost:hover { background: #ebf2fa; }
  #status {
    background: white; padding: 10px 20px; font-size: 12px; border-bottom: 1px solid #e2e8f0;
  }
  #status.err { color: #961e1e; font-weight: 600; }
  #status.ok { color: #006e2e; font-weight: 600; }
  #results { background: white; padding: 0 20px 24px; border-radius: 0 0 6px 6px; }
  .card {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
    padding: 16px 0; border-bottom: 1px solid #e2e8f0;
  }
  .card .kpi { text-align: center; }
  .card .kpi .v { font-size: 19px; font-weight: 700; color: #08213f; }
  .card .kpi .l { font-size: 10.5px; color: #6b7280; margin-top: 2px; }
  h2.sec {
    font-size: 13.5px; font-weight: 700; color: #08213f; margin: 18px 0 8px;
    padding-left: 8px; border-left: 3px solid #fdbb31;
  }
  table.t { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.t th, table.t td {
    border: 1px solid #d1d5db; padding: 4px 6px; text-align: center;
  }
  table.t thead th { background: #08213f; color: white; font-weight: 600; }
  table.t tbody td.lbl { background: #f7f8fa; font-weight: 700; color: #08213f; }
  .up { color: #961e1e; font-weight: 600; }
  .down { color: #006e2e; font-weight: 600; }
  .zero { color: #9ca3af; }
  .jsonbox {
    background: #0f1b2d; color: #cbd5e1; font-family: 'Consolas', monospace;
    font-size: 11px; padding: 14px; border-radius: 4px; margin-top: 8px;
    max-height: 360px; overflow: auto; white-space: pre;
  }
  .toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hidden { display: none; }
  .note { font-size: 11px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>하자 분석 엔진 — 검증 도구</h1>
    <div class="sub">전체 하자 목록 엑셀을 올리면, 리포트에 들어갈 계산 결과를 산출합니다 · 파일은 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다</div>
  </div>

  <div class="drop" id="drop">
    <div class="big">전체 하자 목록 엑셀 파일을 선택하세요</div>
    <div class="small">파일명은 상관없습니다. 여러 현장이면 한 파일에 한 현장씩 · .xlsx / .xls 지원</div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
    <button class="btn" id="pickBtn">엑셀 파일 선택</button>
    <div class="note">또는 이 영역으로 파일을 끌어다 놓으세요</div>
  </div>

  <div id="status">대기 중 — 파일을 선택하면 분석이 시작됩니다.</div>

  <div id="results" class="hidden"></div>
</div>

<script>
/* =====================================================================
 * 하자처리 현황 분석 엔진 (analyze.py → JavaScript 이식)
 * 브라우저/Node 양쪽에서 동작. 입력: 엑셀 행 객체 배열. 출력: siteData JSON.
 * ===================================================================== */
(function (root) {
  'use strict';

  var DAY = 86400000;

  /* ---- 권역 등록부 (site_registry.md) ---- */
  var REGION_MAP = {
    '힐스테이트 두정역': '1권역',
    '힐스테이트 고덕 스카이시티': '1권역',
    '힐스테이트 평택 더퍼스트': '1권역',
    '힐스테이트 오산 더퍼스트': '1권역',
    '힐스테이트 지제역 퍼스티움': '1권역',
    '힐스테이트 유성': '2권역',
    '힐스테이트 가양 더와이즈': '2권역',
    '힐스테이트 도안 퍼스트': '2권역',
    '갑천1 트리풀시티 힐스테이트': '2권역',
    '라펜트힐': '광주 권역',
    '힐스테이트 첨단': '광주 권역',
    '힐스테이트 신용 더리버': '광주 권역',
    '힐스테이트 익산 더퍼스트': '광주 권역'
  };

  /* ---- 날짜 유틸 (타임존 안전: 모든 날짜를 UTC 자정 ms로 정규화) ---- */
  function toDayTS(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) {
      if (isNaN(v.getTime())) return null;
      return Date.UTC(v.getFullYear(), v.getMonth(), v.getDate());
    }
    if (typeof v === 'number') {
      // 엑셀 시리얼 날짜 (1899-12-30 기준)
      var ms = Math.round((v - 25569) * 86400 * 1000);
      var d = new Date(ms);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }
    var s = String(v).trim();
    if (!s) return null;
    var m = s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    var d2 = new Date(s);
    if (!isNaN(d2.getTime())) return Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
    return null;
  }

  function dayDiff(a, b) { return Math.round((a - b) / DAY); }
  function ymd(ts) {
    var d = new Date(ts);
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  }
  function monthStart(y, m) { return Date.UTC(y, m - 1, 1); }      // m: 1-based
  function monthEndTS(y, m) { return Date.UTC(y, m, 0); }          // m: 1-based → 말일
  function r1(x) { return Math.round((x + 1e-9) * 10) / 10; }      // 소수1자리 반올림

  /* ---- 집계 유틸 ---- */
  function valueCounts(arr) {
    // [{key, count}] 내림차순. 동률은 첫 등장 순서 유지.
    var map = {}, order = [];
    for (var i = 0; i < arr.length; i++) {
      var k = arr[i];
      if (k === null || k === undefined || k === '') continue;
      k = String(k);
      if (!(k in map)) { map[k] = 0; order.push(k); }
      map[k]++;
    }
    var list = order.map(function (k, idx) { return { key: k, count: map[k], idx: idx }; });
    list.sort(function (a, b) { return b.count - a.count || a.idx - b.idx; });
    return list;
  }
  function mode(arr) {
    var vc = valueCounts(arr);
    return vc.length ? vc[0].key : null;
  }
  function mean(arr) {
    if (!arr.length) return 0;
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  /* =====================================================================
   * 데이터 로드 + 정제
   * rows: 엑셀에서 읽은 행 객체 배열 (헤더 키 = 컬럼명)
   * ===================================================================== */
  function prepare(rows) {
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      // Dummy(공가 점검용) 제외
      if (r['공간'] === '공가(미분양/미입주)') continue;
      var rcv = toDayTS(r['접수일']);
      if (rcv === null) continue; // 접수일 없는 행은 분석 불가
      out.push({
        접수일: rcv,
        처리확인일: toDayTS(r['처리확인일']),
        현장: r['현장'],
        현장코드: r['현장코드'],
        동: r['동'],
        호: r['호'],
        입주상태: r['입주상태'],
        하자구분: r['하자구분'],
        공간: r['공간'],
        공종: r['공종'],
        시공업체: r['시공업체'],
        보수주체: r['보수주체']
      });
    }
    return out;
  }

  /* ---- 기준일 자동 감지: 접수일 최대값의 전월 말일 ---- */
  function detectBaseDate(data) {
    var maxTS = -Infinity;
    for (var i = 0; i < data.length; i++) if (data[i].접수일 > maxTS) maxTS = data[i].접수일;
    var d = new Date(maxTS);
    var firstOfMonth = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    return { base: firstOfMonth - DAY, max: maxTS };
  }

  /* ---- 기준일 시점 누계 통계 ---- */
  function calcStatus(data, baseDate, prevDate) {
    var received = [], proc = 0, unp = [];
    for (var i = 0; i < data.length; i++) {
      var row = data[i];
      if (row.접수일 > baseDate) continue;
      received.push(row);
      var done = row.처리확인일 !== null && row.처리확인일 <= baseDate;
      if (done) proc++;
      else unp.push(row);
    }
    var total = received.length;
    var rate = total > 0 ? proc / total : 0;

    var periodProc = 0;
    if (prevDate !== null && prevDate !== undefined) {
      for (var j = 0; j < data.length; j++) {
        var c = data[j].처리확인일;
        if (c !== null && c > prevDate && c <= baseDate) periodProc++;
      }
    }

    var normal = 0, d30 = 0, d60 = 0;
    for (var k = 0; k < unp.length; k++) {
      var delay = dayDiff(baseDate, unp[k].접수일);
      if (delay < 30) normal++;
      else if (delay < 60) d30++;
      else d60++;
    }
    var longTotal = d30 + d60;
    var totalUnp = unp.length;
    var longRatio = totalUnp > 0 ? longTotal / totalUnp : 0;

    return {
      전체접수: total,
      누계처리: proc,
      처리율: r1(rate * 100),
      기간처리: periodProc,
      일반하자: normal,
      d30_59: d30,
      d60: d60,
      장기소계: longTotal,
      장기비율: r1(longRatio * 100),
      미처리합계: totalUnp
    };
  }

  /* ---- 월별 통계 ---- */
  function monthlyStats(data, year, maxTS) {
    var results = [];
    var prevEnd = Date.UTC(year - 1, 11, 31);
    for (var month = 1; month <= 12; month++) {
      var ms = monthStart(year, month);
      var me = monthEndTS(year, month);
      if (ms > maxTS) break;
      var newReceived = 0;
      for (var i = 0; i < data.length; i++) {
        if (data[i].접수일 >= ms && data[i].접수일 <= me) newReceived++;
      }
      var st = calcStatus(data, me, prevEnd);
      st.label = month + '월';
      st.월별접수 = newReceived;
      results.push(st);
      prevEnd = me;
    }
    return results;
  }

  /* ---- 주차별 통계 (각 주 토요일 기준) ---- */
  function pandasWeekday(ts) {
    // 월=0 ... 일=6
    var js = new Date(ts).getUTCDay(); // 일=0..토=6
    return (js + 6) % 7;
  }
  function firstSaturday(fromTS) {
    var add = ((5 - pandasWeekday(fromTS)) % 7 + 7) % 7;
    return fromTS + add * DAY;
  }
  function weeklyStats(data, year, maxTS) {
    var results = [];
    var yearStart = Date.UTC(year, 0, 1);
    var firstSat = firstSaturday(yearStart);
    var prev = firstSat - 7 * DAY;
    var cur = firstSat;
    var limit = maxTS + 7 * DAY;
    while (cur <= limit) {
      var d = new Date(cur);
      var month = d.getUTCMonth() + 1;
      var firstOfMonth = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
      var firstSatM = firstSaturday(firstOfMonth);
      var weekNum = Math.floor(dayDiff(cur, firstSatM) / 7) + 1;

      var newReceived = 0;
      for (var i = 0; i < data.length; i++) {
        if (data[i].접수일 > prev && data[i].접수일 <= cur) newReceived++;
      }
      var st = calcStatus(data, cur, prev);
      st.month = month;
      st.week = weekNum;
      st.주간접수 = newReceived;
      results.push(st);
      prev = cur;
      cur = cur + 7 * DAY;
    }
    return results;
  }

  /* ---- 연속 항목 간 증감 ---- */
  function addChange(items, key, changeKey) {
    for (var i = 0; i < items.length; i++) {
      items[i][changeKey] = (i === 0) ? null : (items[i][key] - items[i - 1][key]);
    }
    return items;
  }

  /* ---- 장기미처리 상위 N개 공종 ---- */
  function longTermTrades(data, baseDate, prevBaseDate, topN) {
    topN = topN || 5;
    function lt(d) {
      var res = [];
      for (var i = 0; i < data.length; i++) {
        var row = data[i];
        if (row.접수일 > d) continue;
        var done = row.처리확인일 !== null && row.처리확인일 <= d;
        if (done) continue;
        if (dayDiff(d, row.접수일) >= 30) res.push(row);
      }
      return res;
    }
    var cur = lt(baseDate), prev = lt(prevBaseDate);
    var curCnt = valueCounts(cur.map(function (r) { return r.공종; }));
    var prevCnt = {};
    valueCounts(prev.map(function (r) { return r.공종; })).forEach(function (o) { prevCnt[o.key] = o.count; });

    var top = curCnt.slice(0, topN).map(function (o) { return o.key; });
    var rows = [];
    top.forEach(function (trade) {
      var sub = cur.filter(function (r) { return String(r.공종) === trade; });
      var vendor = sub.length ? (mode(sub.map(function (r) { return r.시공업체; })) || '-') : '-';
      var cNow = sub.length;
      var cPrev = prevCnt[trade] || 0;
      rows.push({ 공종: trade, 시공업체: vendor, 전월: cPrev, 금월: cNow, 증감: cNow - cPrev });
    });

    var topSet = {};
    top.forEach(function (t) { topSet[t] = 1; });
    var etcNow = cur.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcPrev = prev.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcTrades = valueCounts(etcNow.map(function (r) { return r.공종; }));
    var etcVendors = valueCounts(etcNow.map(function (r) { return r.시공업체; }));
    var sixthTrade = curCnt.length > topN ? curCnt[topN].key : null;
    var sixthVendor = etcVendors.length ? etcVendors[0].key : null;

    return {
      상위: rows,
      기타: {
        공종_라벨: (sixthTrade && etcTrades.length > 0)
          ? (sixthTrade + ' 외 ' + (etcTrades.length - 1) + '개 공종') : '기타',
        시공업체_라벨: (sixthVendor && etcVendors.length > 0)
          ? (sixthVendor + ' 외 ' + (etcVendors.length - 1) + '개사') : '다수',
        전월: etcPrev.length,
        금월: etcNow.length,
        증감: etcNow.length - etcPrev.length
      },
      합계: { 전월: prev.length, 금월: cur.length, 증감: cur.length - prev.length }
    };
  }

  /* ---- 공가세대 처리현황 ---- */
  function emptyUnitStats(data, baseDate, topN) {
    topN = topN || 5;
    var empty = data.filter(function (r) {
      return r.하자구분 === '세대' && (r.입주상태 === '미분양' || r.입주상태 === '미납');
    });
    var received = [], processed = [], unp = [];
    empty.forEach(function (r) {
      if (r.접수일 > baseDate) return;
      received.push(r);
      var done = r.처리확인일 !== null && r.처리확인일 <= baseDate;
      if (done) processed.push(r); else unp.push(r);
    });

    function group(state) {
      var rec = received.filter(function (r) { return r.입주상태 === state; });
      var proc = processed.filter(function (r) { return r.입주상태 === state; });
      var u = unp.filter(function (r) { return r.입주상태 === state; });
      var hh = {};
      empty.forEach(function (r) {
        if (r.입주상태 === state) hh[String(r.동) + '|' + String(r.호)] = 1;
      });
      var normal = 0, d30 = 0, d60 = 0;
      u.forEach(function (r) {
        var delay = dayDiff(baseDate, r.접수일);
        if (delay < 30) normal++; else if (delay < 60) d30++; else d60++;
      });
      return {
        상태: state, 세대수: Object.keys(hh).length,
        접수: rec.length, 처리: proc.length,
        처리율: rec.length > 0 ? r1(proc.length / rec.length * 100) : 0,
        일반: normal, d30_59: d30, d60: d60, 미처리합계: u.length
      };
    }
    var misun = group('미분양'), minab = group('미납');
    var sumRec = misun.접수 + minab.접수, sumProc = misun.처리 + minab.처리;

    var cnt = valueCounts(unp.map(function (r) { return r.공종; }));
    var topTrades = [];
    cnt.slice(0, topN).forEach(function (o) {
      var sub = unp.filter(function (r) { return String(r.공종) === o.key; });
      var vendor = sub.length ? (mode(sub.map(function (r) { return r.시공업체; })) || '-') : '-';
      topTrades.push({ 공종: o.key, 시공업체: vendor, 미처리: o.count });
    });
    var topSet = {};
    topTrades.forEach(function (t) { topSet[t.공종] = 1; });
    var etc = unp.filter(function (r) { return !topSet[String(r.공종)]; });
    var etcTrades = valueCounts(etc.map(function (r) { return r.공종; }));
    var etcVendors = valueCounts(etc.map(function (r) { return r.시공업체; }));
    var sixthTrade = cnt.length > topN ? cnt[topN].key : null;
    var sixthVendor = etcVendors.length ? etcVendors[0].key : null;

    return {
      미분양: misun, 미납: minab,
      합계: {
        세대수: misun.세대수 + minab.세대수,
        접수: sumRec, 처리: sumProc,
        처리율: sumRec > 0 ? r1(sumProc / sumRec * 100) : 0,
        일반: misun.일반 + minab.일반,
        d30_59: misun.d30_59 + minab.d30_59,
        d60: misun.d60 + minab.d60,
        미처리합계: misun.미처리합계 + minab.미처리합계
      },
      상위공종: topTrades,
      기타공종: {
        공종_라벨: (sixthTrade && etcTrades.length > 0)
          ? (sixthTrade + ' 외 ' + (etcTrades.length - 1) + '개 공종') : '기타',
        시공업체_라벨: (sixthVendor && etcVendors.length > 0)
          ? (sixthVendor + ' 외 ' + (etcVendors.length - 1) + '개사') : '다수',
        미처리: etc.length
      }
    };
  }

  /* ---- CS팀장 분석 의견 데이터 ---- */
  function analysisInsights(data, baseDate, maxTS) {
    var received = [], unp = [];
    data.forEach(function (r) {
      if (r.접수일 > baseDate) return;
      received.push(r);
      var done = r.처리확인일 !== null && r.처리확인일 <= baseDate;
      if (!done) unp.push(r);
    });
    var totalUnp = unp.length;
    unp.forEach(function (r) { r._delay = dayDiff(baseDate, r.접수일); });

    // 보수주체 분포
    var subjects = {};
    valueCounts(unp.map(function (r) { return r.보수주체; })).forEach(function (o) {
      var sub = unp.filter(function (r) { return String(r.보수주체) === o.key; });
      subjects[o.key] = {
        건수: sub.length,
        비율: totalUnp > 0 ? r1(sub.length / totalUnp * 100) : 0,
        평균지연: sub.length ? Math.trunc(mean(sub.map(function (r) { return r._delay; }))) : 0
      };
    });

    // 협력사별 처리율 (접수 50건 이상)
    var vendorStats = {};
    valueCounts(received.map(function (r) { return r.시공업체; })).forEach(function (o) {
      if (o.count < 50) return;
      var rec = received.filter(function (r) { return String(r.시공업체) === o.key; });
      var proc = rec.filter(function (r) {
        return r.처리확인일 !== null && r.처리확인일 <= baseDate;
      });
      var u = unp.filter(function (r) { return String(r.시공업체) === o.key; });
      vendorStats[o.key] = {
        접수: rec.length,
        처리율: r1(proc.length / rec.length * 100),
        미처리: u.length,
        장기미처리: u.filter(function (r) { return r._delay >= 30; }).length,
        평균지연: u.length ? Math.trunc(mean(u.map(function (r) { return r._delay; }))) : 0
      };
    });
    var lowVendors = Object.keys(vendorStats)
      .map(function (k) { return [k, vendorStats[k]]; })
      .sort(function (a, b) { return a[1].처리율 - b[1].처리율; })
      .slice(0, 3);

    // 60일 이상 적체
    var over60 = unp.filter(function (r) { return r._delay >= 60; });
    var over60Delays = over60.map(function (r) { return r._delay; });
    var over60Stats = {
      건수: over60.length,
      비율: totalUnp > 0 ? r1(over60.length / totalUnp * 100) : 0,
      평균지연: over60.length ? Math.trunc(mean(over60Delays)) : 0,
      최대지연: over60.length ? Math.max.apply(null, over60Delays) : 0,
      d90: over60.filter(function (r) { return r._delay >= 90; }).length,
      d180: over60.filter(function (r) { return r._delay >= 180; }).length,
      d365: over60.filter(function (r) { return r._delay >= 365; }).length
    };

    // 월별 신규 접수
    var monthlyNew = {};
    var baseYear = new Date(baseDate).getUTCFullYear();
    for (var m = 1; m <= 12; m++) {
      var ms = monthStart(baseYear, m), me = monthEndTS(baseYear, m);
      if (ms > maxTS) break;
      var c = 0;
      data.forEach(function (r) { if (r.접수일 >= ms && r.접수일 <= me) c++; });
      monthlyNew[m + '월'] = c;
    }

    return {
      보수주체: subjects,
      협력사: vendorStats,
      저조협력사: lowVendors,
      d60이상: over60Stats,
      월별신규접수: monthlyNew,
      총미처리: totalUnp
    };
  }

  /* =====================================================================
   * 메인: 엑셀 행 배열 → siteData
   * ===================================================================== */
  function analyze(rows, opts) {
    opts = opts || {};
    var data = prepare(rows);
    if (!data.length) throw new Error('분석할 데이터가 없습니다. (접수일/공간 컬럼 확인)');

    var siteName = mode(data.map(function (r) { return r.현장; }));
    var siteCode = mode(data.map(function (r) { return r.현장코드; }));

    var bd = detectBaseDate(data);
    var baseDate = bd.base, maxTS = bd.max;
    var year = opts.year || new Date(maxTS).getUTCFullYear();

    var monthly = monthlyStats(data, year, maxTS);
    addChange(monthly, '미처리합계', '합계증감');
    addChange(monthly, '장기소계', '장기증감');
    addChange(monthly, '기간처리', '처리증감');

    var weekly = weeklyStats(data, year, maxTS);
    addChange(weekly, '미처리합계', '합계증감');
    addChange(weekly, '장기소계', '장기증감');
    addChange(weekly, '기간처리', '처리증감');

    var bdD = new Date(baseDate);
    var prevBase = Date.UTC(bdD.getUTCFullYear(), bdD.getUTCMonth(), 1) - DAY;

    var trades = longTermTrades(data, baseDate, prevBase, 5);
    var empty = emptyUnitStats(data, baseDate, 5);
    var insights = analysisInsights(data, baseDate, maxTS);

    return {
      현장명: siteName,
      현장코드: siteCode,
      권역: REGION_MAP[siteName] || null,
      기준일: ymd(baseDate),
      데이터_최대일: ymd(maxTS),
      연도: year,
      행수: data.length,
      월별: monthly,
      주차별: weekly,
      장기미처리공종: trades,
      공가세대: empty,
      분석: insights
    };
  }

  var API = {
    analyze: analyze,
    prepare: prepare,
    toDayTS: toDayTS,
    REGION_MAP: REGION_MAP,
    _internal: {
      detectBaseDate: detectBaseDate, calcStatus: calcStatus,
      monthlyStats: monthlyStats, weeklyStats: weeklyStats,
      longTermTrades: longTermTrades, emptyUnitStats: emptyUnitStats,
      analysisInsights: analysisInsights
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.DefectEngine = API;

})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* ===== UI: 파일 읽기 → 분석 → 표 렌더링 ===== */
(function () {
  'use strict';
  var fileInput = document.getElementById('fileInput');
  var pickBtn   = document.getElementById('pickBtn');
  var drop      = document.getElementById('drop');
  var statusEl  = document.getElementById('status');
  var resultsEl = document.getElementById('results');
  var lastResult = null;

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  pickBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  /* 헤더 행 자동 탐지: '접수일'과 '현장'이 모두 있는 행 */
  function findHeaderRow(aoa) {
    for (var i = 0; i < Math.min(aoa.length, 10); i++) {
      var row = aoa[i] || [];
      var has접수일 = false, has현장 = false;
      for (var j = 0; j < row.length; j++) {
        var v = String(row[j] || '').trim();
        if (v === '접수일') has접수일 = true;
        if (v === '현장') has현장 = true;
      }
      if (has접수일 && has현장) return i;
    }
    return 3; // 문서 기본값
  }

  function handleFile(file) {
    setStatus('"' + file.name + '" 읽는 중...', '');
    resultsEl.classList.add('hidden');
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
        var hIdx = findHeaderRow(aoa);
        var header = aoa[hIdx];
        var dataRows = aoa.slice(hIdx + 1).filter(function (r) {
          return r && r.some(function (c) { return c !== null && c !== ''; });
        });
        var objRows = dataRows.map(function (r) {
          var o = {};
          header.forEach(function (h, idx) { if (h != null) o[String(h).trim()] = r[idx]; });
          return o;
        });
        if (!objRows.length) throw new Error('데이터 행을 찾지 못했습니다. 엑셀 형식을 확인하세요.');

        var result = window.DefectEngine.analyze(objRows);
        lastResult = result;
        renderResults(result, hIdx);
        setStatus('✓ 분석 완료 — ' + result.현장명 + ' (' + result.행수 + '행, 기준일 ' + result.기준일 + ')', 'ok');
      } catch (err) {
        console.error(err);
        setStatus('✗ 오류: ' + err.message, 'err');
      }
    };
    reader.onerror = function () { setStatus('✗ 파일을 읽지 못했습니다.', 'err'); };
    reader.readAsArrayBuffer(file);
  }

  /* ---- 렌더링 헬퍼 ---- */
  function fmt(n) {
    if (n === null || n === undefined) return '—';
    if (typeof n === 'number') return n.toLocaleString('ko-KR');
    return String(n);
  }
  function chg(diff) {
    if (diff === null || diff === undefined) return '<span class="zero">—</span>';
    if (diff > 0) return '<span class="up">+' + diff.toLocaleString('ko-KR') + '</span>';
    if (diff < 0) return '<span class="down">−' + Math.abs(diff).toLocaleString('ko-KR') + '</span>';
    return '<span class="zero">0</span>';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  function renderResults(d, hIdx) {
    var h = [];

    h.push('<div class="card">');
    h.push(kpi(esc(d.현장명), '현장명'));
    h.push(kpi(esc(d.현장코드), '현장코드'));
    h.push(kpi(esc(d.권역 || '미등록'), '권역'));
    h.push(kpi(d.기준일, '기준일'));
    h.push(kpi(d.데이터_최대일, '데이터 최대일'));
    h.push(kpi(fmt(d.행수) + '행', '유효 데이터'));
    h.push('</div>');

    // 월별
    h.push('<h2 class="sec">월별 현황</h2>');
    h.push(statusTable(d.월별, '구분', 'label', '월별접수', '월별접수'));

    // 주차별
    h.push('<h2 class="sec">주차별 현황 (' + d.주차별.length + '주차)</h2>');
    h.push(weeklyTable(d.주차별));

    // 장기미처리 공종
    h.push('<h2 class="sec">장기미처리 상위 5개 공종 (30일 이상)</h2>');
    h.push(tradeTable(d.장기미처리공종));

    // 공가세대
    h.push('<h2 class="sec">공가세대 처리현황</h2>');
    h.push(emptyTable(d.공가세대));
    h.push('<h2 class="sec">공가세대 미처리 상위 5개 공종</h2>');
    h.push(emptyTradeTable(d.공가세대));

    // 분석 의견
    h.push('<h2 class="sec">분석 의견 데이터 (CS팀장 관점)</h2>');
    h.push(insightTable(d.분석));

    // JSON
    h.push('<h2 class="sec">계산 결과 원본 (JSON)</h2>');
    h.push('<div class="note">헤더 행은 엑셀 ' + (hIdx + 1) + '번째 줄에서 자동 인식되었습니다.</div>');
    h.push('<div class="jsonbox" id="jsonbox">' + esc(JSON.stringify(d, null, 2)) + '</div>');
    h.push('<div class="toolbar">');
    h.push('<button class="btn" id="dlBtn">JSON 파일 저장</button>');
    h.push('<button class="btn ghost" id="cpBtn">JSON 복사</button>');
    h.push('</div>');

    resultsEl.innerHTML = h.join('');
    resultsEl.classList.remove('hidden');

    document.getElementById('dlBtn').addEventListener('click', function () {
      var blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'siteData_' + lastResult.현장코드 + '.json';
      a.click();
    });
    document.getElementById('cpBtn').addEventListener('click', function () {
      navigator.clipboard.writeText(JSON.stringify(lastResult, null, 2)).then(function () {
        document.getElementById('cpBtn').textContent = '복사됨 ✓';
        setTimeout(function () { document.getElementById('cpBtn').textContent = 'JSON 복사'; }, 1500);
      });
    });
  }

  function kpi(v, l) {
    return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  }

  function statusTable(rows, labelHead, labelKey, periodHead, periodKey) {
    var h = ['<table class="t"><thead><tr>',
      '<th>', labelHead, '</th><th>전체접수</th><th>', periodHead,
      '</th><th>누계처리</th><th>처리율</th><th>당월처리</th><th>증감</th>',
      '<th>일반하자</th><th>30~59일</th><th>60일↑</th><th>장기소계</th><th>장기비율</th><th>장기증감</th>',
      '<th>미처리합계</th><th>합계증감</th></tr></thead><tbody>'];
    rows.forEach(function (m) {
      h.push('<tr><td class="lbl">' + esc(m[labelKey]) + '</td>',
        '<td>' + fmt(m.전체접수) + '</td>',
        '<td>' + fmt(m[periodKey]) + '</td>',
        '<td>' + fmt(m.누계처리) + '</td>',
        '<td>' + m.처리율 + '%</td>',
        '<td>' + fmt(m.기간처리) + '</td>',
        '<td>' + chg(m.처리증감) + '</td>',
        '<td>' + fmt(m.일반하자) + '</td>',
        '<td>' + fmt(m.d30_59) + '</td>',
        '<td>' + fmt(m.d60) + '</td>',
        '<td>' + fmt(m.장기소계) + '</td>',
        '<td>' + m.장기비율 + '%</td>',
        '<td>' + chg(m.장기증감) + '</td>',
        '<td>' + fmt(m.미처리합계) + '</td>',
        '<td>' + chg(m.합계증감) + '</td></tr>');
    });
    return h.join('') + '</tbody></table>';
  }

  function weeklyTable(rows) {
    var h = ['<table class="t"><thead><tr>',
      '<th>월</th><th>주차</th><th>전체접수</th><th>주간접수</th><th>누계처리</th><th>처리율</th>',
      '<th>주간처리</th><th>증감</th><th>일반하자</th><th>30~59일</th><th>60일↑</th>',
      '<th>장기소계</th><th>장기비율</th><th>장기증감</th><th>미처리합계</th><th>합계증감</th>',
      '</tr></thead><tbody>'];
    rows.forEach(function (w) {
      h.push('<tr><td class="lbl">' + w.month + '월</td><td class="lbl">' + w.week + '주</td>',
        '<td>' + fmt(w.전체접수) + '</td>',
        '<td>' + fmt(w.주간접수) + '</td>',
        '<td>' + fmt(w.누계처리) + '</td>',
        '<td>' + w.처리율 + '%</td>',
        '<td>' + fmt(w.기간처리) + '</td>',
        '<td>' + chg(w.처리증감) + '</td>',
        '<td>' + fmt(w.일반하자) + '</td>',
        '<td>' + fmt(w.d30_59) + '</td>',
        '<td>' + fmt(w.d60) + '</td>',
        '<td>' + fmt(w.장기소계) + '</td>',
        '<td>' + w.장기비율 + '%</td>',
        '<td>' + chg(w.장기증감) + '</td>',
        '<td>' + fmt(w.미처리합계) + '</td>',
        '<td>' + chg(w.합계증감) + '</td></tr>');
    });
    return h.join('') + '</tbody></table>';
  }

  function tradeTable(t) {
    var h = ['<table class="t"><thead><tr><th>순위</th><th>공종</th><th>시공업체</th>',
      '<th>전월</th><th>금월</th><th>증감</th></tr></thead><tbody>'];
    t.상위.forEach(function (r, i) {
      h.push('<tr><td class="lbl">' + (i + 1) + '</td><td>' + esc(r.공종) + '</td><td>' + esc(r.시공업체) + '</td>',
        '<td>' + fmt(r.전월) + '</td><td>' + fmt(r.금월) + '</td><td>' + chg(r.증감) + '</td></tr>');
    });
    h.push('<tr><td class="lbl">기타</td><td>' + esc(t.기타.공종_라벨) + '</td><td>' + esc(t.기타.시공업체_라벨) + '</td>',
      '<td>' + fmt(t.기타.전월) + '</td><td>' + fmt(t.기타.금월) + '</td><td>' + chg(t.기타.증감) + '</td></tr>');
    h.push('<tr><td class="lbl" colspan="3">합계 (전체 장기미처리)</td>',
      '<td>' + fmt(t.합계.전월) + '</td><td>' + fmt(t.합계.금월) + '</td><td>' + chg(t.합계.증감) + '</td></tr>');
    return h.join('') + '</tbody></table>';
  }

  function emptyTable(e) {
    var h = ['<table class="t"><thead><tr><th>구분</th><th>세대수</th><th>누계접수</th><th>처리</th><th>처리율</th>',
      '<th>30일미만</th><th>30~59일</th><th>60일↑</th><th>미처리합계</th></tr></thead><tbody>'];
    [e.미분양, e.미납].forEach(function (g) {
      h.push('<tr><td class="lbl">' + esc(g.상태) + '</td><td>' + fmt(g.세대수) + '</td>',
        '<td>' + fmt(g.접수) + '</td><td>' + fmt(g.처리) + '</td><td>' + g.처리율 + '%</td>',
        '<td>' + fmt(g.일반) + '</td><td>' + fmt(g.d30_59) + '</td><td>' + fmt(g.d60) + '</td>',
        '<td>' + fmt(g.미처리합계) + '</td></tr>');
    });
    var s = e.합계;
    h.push('<tr><td class="lbl">합계</td><td>' + fmt(s.세대수) + '</td><td>' + fmt(s.접수) + '</td>',
      '<td>' + fmt(s.처리) + '</td><td>' + s.처리율 + '%</td><td>' + fmt(s.일반) + '</td>',
      '<td>' + fmt(s.d30_59) + '</td><td>' + fmt(s.d60) + '</td><td>' + fmt(s.미처리합계) + '</td></tr>');
    return h.join('') + '</tbody></table>';
  }

  function emptyTradeTable(e) {
    var h = ['<table class="t"><thead><tr><th>순위</th><th>공종</th><th>시공업체</th><th>미처리</th></tr></thead><tbody>'];
    e.상위공종.forEach(function (r, i) {
      h.push('<tr><td class="lbl">' + (i + 1) + '</td><td>' + esc(r.공종) + '</td>',
        '<td>' + esc(r.시공업체) + '</td><td>' + fmt(r.미처리) + '</td></tr>');
    });
    h.push('<tr><td class="lbl">기타</td><td>' + esc(e.기타공종.공종_라벨) + '</td>',
      '<td>' + esc(e.기타공종.시공업체_라벨) + '</td><td>' + fmt(e.기타공종.미처리) + '</td></tr>');
    return h.join('') + '</tbody></table>';
  }

  function insightTable(ins) {
    var h = [];
    // 보수주체
    h.push('<table class="t"><thead><tr><th>보수주체</th><th>미처리 건수</th><th>비율</th><th>평균지연(일)</th></tr></thead><tbody>');
    Object.keys(ins.보수주체).forEach(function (k) {
      var s = ins.보수주체[k];
      h.push('<tr><td class="lbl">' + esc(k) + '</td><td>' + fmt(s.건수) + '</td>',
        '<td>' + s.비율 + '%</td><td>' + fmt(s.평균지연) + '</td></tr>');
    });
    h.push('</tbody></table>');
    // 60일 이상
    var o = ins.d60이상;
    h.push('<table class="t" style="margin-top:8px"><thead><tr><th>60일↑ 건수</th><th>비율</th>',
      '<th>평균지연</th><th>최대지연</th><th>90일↑</th><th>180일↑</th><th>365일↑</th></tr></thead><tbody><tr>',
      '<td>' + fmt(o.건수) + '</td><td>' + o.비율 + '%</td><td>' + fmt(o.평균지연) + '</td>',
      '<td>' + fmt(o.최대지연) + '</td><td>' + fmt(o.d90) + '</td><td>' + fmt(o.d180) + '</td>',
      '<td>' + fmt(o.d365) + '</td></tr></tbody></table>');
    // 저조 협력사
    h.push('<table class="t" style="margin-top:8px"><thead><tr><th>처리율 저조 협력사</th><th>접수</th>',
      '<th>처리율</th><th>미처리</th><th>장기미처리</th><th>평균지연</th></tr></thead><tbody>');
    if (ins.저조협력사.length === 0) {
      h.push('<tr><td colspan="6">접수 50건 이상 협력사 없음</td></tr>');
    }
    ins.저조협력사.forEach(function (pair) {
      var v = pair[1];
      h.push('<tr><td class="lbl">' + esc(pair[0]) + '</td><td>' + fmt(v.접수) + '</td>',
        '<td>' + v.처리율 + '%</td><td>' + fmt(v.미처리) + '</td><td>' + fmt(v.장기미처리) + '</td>',
        '<td>' + fmt(v.평균지연) + '</td></tr>');
    });
    h.push('</tbody></table>');
    return h.join('');
  }
})();
</script>
